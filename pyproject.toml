[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[project]
name = "mitotic-phases"
version = "0.1.0"
description = "Probabilistic soft-labeling framework for mitotic phase classification under inter-observer uncertainty in histopathology."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Elyesse Benyeloul", email = "elyesse.benyeloul@etu.minesparis.psl.eu" }
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "seaborn>=0.13",
    "torch>=2.2",
    "torchvision>=0.17",
]

[project.optional-dependencies]
full = [
    "grad-cam>=1.5",
    "opencv-python>=4.9",
    "torchstain>=1.3",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
